# Deploys the validated static build to GitHub Pages. Downstream of the normal
# product build: npm run build:deploy → dist/index.html, the same bytes as
# saas-physics-v1.html. No framework, no server, no secrets.
name: Deploy to GitHub Pages

on:
  push:
    branches: [v2-economic-legibility]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test
      - run: npm run build:deploy
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
